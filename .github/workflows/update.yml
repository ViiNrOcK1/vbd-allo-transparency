name: Update and publish

# Every 6 hours, plus on every push to main and on demand. Runs entirely on GitHub
# (Actions + Pages): no Netlify build minutes, no keys — the data is public
# and read-only from a VeChain node.
on:
  schedule:
    # Every 6 hours, so a round's claims show up the same day.
    - cron: '23 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      investigate:
        description: 'App name to investigate new wallets for (output encrypted with the audit key)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Remembers which addresses are contracts / B3TR pools and what each
      # transaction did, so daily runs only ask the node about new activity.
      - uses: actions/cache@v4
        with:
          path: cache
          key: chain-cache-${{ github.run_id }}
          restore-keys: chain-cache-

      - name: Index VeChain mainnet
        run: node src/index.mjs --out site/data

      - name: Summary
        run: node scripts/report.mjs site/data/summary.json

      # New-wallet investigation, on demand only. Addresses never reach this
      # public log: the details are encrypted with audit/audit-public.pem.
      - name: Investigate
        if: ${{ github.event.inputs.investigate != '' && github.event.inputs.investigate != null }}
        continue-on-error: true
        timeout-minutes: 100
        env:
          APP: ${{ github.event.inputs.investigate }}
        run: |
          node scripts/investigate.mjs "$APP" 7
          openssl rand -hex -out investigate/key.bin 32
          gzip -9 investigate/out.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -in investigate/out.json.gz -out investigate/out.enc -pass file:investigate/key.bin
          openssl pkeyutl -encrypt -pubin -inkey audit/audit-public.pem -pkeyopt rsa_padding_mode:oaep -in investigate/key.bin -out investigate/key.enc
          echo "INV-KEY-BEGIN"; base64 -w0 investigate/key.enc; echo; echo "INV-KEY-END"
          echo "INV-DATA-BEGIN"; base64 -w 50000 investigate/out.enc; echo "INV-DATA-END"
          for f in investigate/*sheet.jpg; do
            [ -f "$f" ] || continue
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out investigate/sheet.enc -pass file:investigate/key.bin
            echo "INV-SHEET-BEGIN $(basename "$f")"; base64 -w 50000 investigate/sheet.enc; echo "INV-SHEET-END"
          done
          rm -rf investigate

      # Accuracy audit: per-round counts in plain text; the sample of merged
      # groups (addresses) is encrypted with audit/audit-public.pem, so only
      # the holder of the private key can read it from this public log.
      - name: Audit
        continue-on-error: true
        run: |
          node scripts/audit.mjs
          openssl rand -hex -out audit/key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in audit/sample.json -out audit/sample.enc -pass file:audit/key.bin
          openssl pkeyutl -encrypt -pubin -inkey audit/audit-public.pem -pkeyopt rsa_padding_mode:oaep -in audit/key.bin -out audit/key.enc
          echo "AUDIT-KEY-BEGIN"; base64 -w0 audit/key.enc; echo; echo "AUDIT-KEY-END"
          echo "AUDIT-DATA-BEGIN"; base64 -w0 audit/sample.enc; echo; echo "AUDIT-DATA-END"
          rm -f audit/key.bin audit/sample.json

      # Cache-busting: every deploy gets fresh script/style URLs, so browsers
      # never keep showing an old chart after an update.
      - name: Version assets
        run: sed -i "s/__V__/${GITHUB_SHA::8}-${GITHUB_RUN_ID}/g" site/index.html site/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
