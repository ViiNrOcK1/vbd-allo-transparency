name: Update and publish

# Every 6 hours, plus on every push to main and on demand. Runs entirely on GitHub
# (Actions + Pages): no Netlify build minutes, no keys — the data is public
# and read-only from a VeChain node.
on:
  schedule:
    # Every 6 hours, so a round's claims show up the same day.
    - cron: '23 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Remembers which addresses are contracts / B3TR pools and what each
      # transaction did, so daily runs only ask the node about new activity.
      - uses: actions/cache@v4
        with:
          path: cache
          key: chain-cache-${{ github.run_id }}
          restore-keys: chain-cache-

      - name: Index VeChain mainnet
        run: node src/index.mjs --out site/data

      - name: Summary
        run: node scripts/report.mjs site/data/summary.json

      # Accuracy audit: per-round counts in plain text; the sample of merged
      # groups (addresses) is encrypted with audit/audit-public.pem, so only
      # the holder of the private key can read it from this public log.
      - name: Audit
        continue-on-error: true
        run: |
          node scripts/audit.mjs
          openssl rand -out audit/key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in audit/sample.json -out audit/sample.enc -pass file:audit/key.bin
          openssl pkeyutl -encrypt -pubin -inkey audit/audit-public.pem -pkeyopt rsa_padding_mode:oaep -in audit/key.bin -out audit/key.enc
          echo "AUDIT-KEY-BEGIN"; base64 -w0 audit/key.enc; echo; echo "AUDIT-KEY-END"
          echo "AUDIT-DATA-BEGIN"; base64 -w0 audit/sample.enc; echo; echo "AUDIT-DATA-END"
          rm -f audit/key.bin audit/sample.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
