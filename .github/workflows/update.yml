name: Update and publish

# Every 6 hours, plus on every push to main and on demand. Runs entirely on GitHub
# (Actions + Pages): no Netlify build minutes, no keys — the data is public
# and read-only from a VeChain node.
on:
  schedule:
    # Every 6 hours, so a round's claims show up the same day.
    - cron: '23 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trace:
        description: 'Optional: wallets to trace in the log (space-separated)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Remembers which addresses are contracts / B3TR pools and what each
      # transaction did, so daily runs only ask the node about new activity.
      - uses: actions/cache@v4
        with:
          path: cache
          key: chain-cache-${{ github.run_id }}
          restore-keys: chain-cache-

      - name: Index VeChain mainnet
        run: node src/index.mjs --out site/data

      - name: Summary
        run: node scripts/report.mjs site/data/summary.json

      - name: Trace wallets (on request)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trace != '' }}
        env:
          TRACE: ${{ inputs.trace }}
        run: node scripts/trace.mjs site/data/summary.json $TRACE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
